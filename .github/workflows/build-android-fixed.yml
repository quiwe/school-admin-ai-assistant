name: Build Android APK (Fixed)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        
    - name: Install dependencies
      run: |
        cd frontend
        npm install
        
    - name: Build Web
      run: |
        cd frontend
        npm run build
        
    - name: Sync Android
      run: |
        cd frontend
        npx cap sync android
        
    - name: Setup Gradle
      uses: gradle/gradle-build-action@v2
      with:
        gradle-version: '8.11.1'
        
    - name: Build Debug APK
      run: |
        cd frontend/android
        chmod +x gradlew
        ./gradlew assembleDebug --stacktrace --info
        
    - name: Build Release APK
      run: |
        cd frontend/android
        ./gradlew assembleRelease --stacktrace --info
        
    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
        
    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: frontend/android/app/build/outputs/apk/release/app-release-unsigned.apk
        
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: |
          frontend/android/app/build/outputs/apk/debug/app-debug.apk
          frontend/android/app/build/outputs/apk/release/app-release-unsigned.apk
        body: |
          ## v1.1.0 - 2026年8月17日
          
          ### 🐛 Bug 修复
          - 修复Android图标显示不完整问题
          
          ### 📦 下载
          - `app-debug.apk` - Android调试版本
          - `app-release-unsigned.apk` - Android发布版本
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}