name: Build Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:  # 允许手动触发

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
        
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'
        
    - name: Install dependencies
      run: |
        cd frontend
        npm ci
        
    - name: Build Web
      run: |
        cd frontend
        npm run build
        
    - name: Sync Android
      run: |
        cd frontend
        npm run android:sync
        
    - name: Setup Gradle
      uses: gradle/gradle-build-action@v2
      with:
        gradle-version: '8.5'
        
    - name: Build Debug APK
      run: |
        cd frontend/android
        gradle assembleDebug
        
    - name: Build Release APK
      run: |
        cd frontend/android
        gradle assembleRelease
        
    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30
        
    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: frontend/android/app/build/outputs/apk/release/app-release-unsigned.apk
        retention-days: 30
        
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: |
          frontend/android/app/build/outputs/apk/debug/app-debug.apk
          frontend/android/app/build/outputs/apk/release/app-release-unsigned.apk
        body: |
          ## v1.1.0 - 2026年8月17日
          
          ### 🐛 Bug 修复
          - 修复Android图标显示不完整问题
          
          ### 📦 下载
          - `app-debug.apk` - Android调试版本（推荐测试使用）
          - `app-release-unsigned.apk` - Android发布版本（未签名）
          
          ### 📋 安装说明
          1. 下载APK文件
          2. 在Android设备上启用"未知来源"安装
          3. 安装APK文件
          4. 享受修复后的应用！
          
          ### 🔧 技术细节
          - 自适应图标配置修复
          - 所有密度的mipmap图标生成
          - 圆形图标变体支持
          - Capacitor 8.3.4
          - React 19.1.0
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}